<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password • XS-Pedia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bgshape one"></div><div class="bgshape two"></div>
  <header class="topbar wrap">
  <a class="brand" href="index.html">XS<span>PEDIA</span></a>
  <nav class="navlinks">
    <a href="index.html">Home</a>
    <a href="register.html">Register</a>
    <a href="login.html">Masuk</a>
    <a href="forgot-password.html">Lupa Password</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="profile.html">Profile</a>
    <a href="docs.html">Dokumentasi</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>
  <main class="wrap page">
  
<section class="card">
  <div class="page-head"><h2>Lupa Password</h2><p class="muted">Masukkan nomor terdaftar. OTP dikirim ke WhatsApp lewat Fonnte.</p></div>
  <form id="forgotForm" class="form">
    <input name="phone" placeholder="Nomor yang didaftarkan (62...)" required>
    <button class="btn" type="submit">KIRIM OTP</button>
  </form>
  <div id="otpBox" class="endpoint hidden">
    <b>Masukkan OTP</b>
    <input id="otpPhone" placeholder="Nomor" readonly>
    <input id="otp" placeholder="Kode OTP">
    <button class="btn" id="verifyOtp" type="button">VERIFIKASI OTP</button>
    <div id="countdown" class="muted">Kirim ulang dalam 30 detik</div>
  </div>
  <div id="resetBox" class="endpoint hidden" style="margin-top:16px">
    <b>Password baru</b>
    <form id="resetForm" class="form">
      <input type="hidden" name="resetToken" id="resetToken">
      <input name="password" type="password" placeholder="Password baru" required>
      <button class="btn" type="submit">UBAH PASSWORD</button>
    </form>
  </div>
</section>

  </main>
  <footer class="footer wrap">XS-Pedia Web Panel • Green comic style • Responsive</footer>
  <div id="toast" class="toast"></div>
  <script src="script.js"></script>
</body></html>
